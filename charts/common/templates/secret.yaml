{{- if or .Values.secrets .Values.secretsStringData }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "common.fullname" . }}
  namespace: {{ template "common.namespace" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.secrets }}
data:
{{- range $key, $val := . }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
{{- end }}
{{- with .Values.secretsStringData }}
stringData:
{{- range $key, $val := . }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.privateRegistry }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "common.fullname" . }}-privateregistry
  namespace: {{ template "common.namespace" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.privateRegistry.dockerconfigjson }}
{{- end }}
